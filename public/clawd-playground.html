<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clawd 动作游乐场 · 100 式</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    min-height: 100vh;
    background: linear-gradient(160deg, #ffeadb 0%, #ffe3ec 40%, #e8e6ff 75%, #dff3ff 100%);
    background-attachment: fixed;
    color: #4a3b32;
  }
  main { max-width: 960px; margin: 0 auto; padding: 34px 20px 40px; }
  h1 { font-size: 30px; letter-spacing: 1px; }
  h1 em { font-style: normal; color: #e2703a; }
  .sub { color: #8a7666; margin: 8px 0 18px; font-size: 14.5px; }
  .stage-wrap {
    position: relative; height: 340px; border-radius: 18px; overflow: hidden;
    background: linear-gradient(180deg, #ffedda 0%, #ffe0ea 52%, #fbe3bd 100%);
    box-shadow: 0 14px 40px rgba(160, 90, 40, 0.18), inset 0 0 0 1px rgba(160, 90, 40, 0.1);
  }
  .stage-wrap::before {
    content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 34px;
    background: linear-gradient(180deg, rgba(214,160,110,.18), rgba(214,160,110,.42));
  }
  .stage-wrap::after {
    content: ''; position: absolute; right: 40px; top: 34px; width: 52px; height: 52px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #fff6d8, #ffd98a);
    box-shadow: 0 0 34px rgba(255, 205, 110, 0.85);
  }
  .now {
    position: absolute; left: 14px; top: 12px; z-index: 5;
    background: rgba(255,255,255,.9); border-radius: 999px; padding: 7px 16px;
    font-size: 13.5px; font-weight: 700; color: #b4442c;
    box-shadow: 0 4px 14px rgba(60,40,20,.16);
  }
  .ctrl { display: flex; flex-wrap: wrap; gap: 10px; margin: 16px 0 6px; align-items: center; }
  .btn {
    border: 1px solid rgba(120, 60, 40, .25); background: rgba(255,255,255,.85);
    border-radius: 999px; padding: 9px 18px; font-size: 14px; font-weight: 600;
    cursor: pointer; color: #4a3b32; transition: all .15s;
  }
  .btn:hover { border-color: #e2703a; color: #e2703a; transform: translateY(-1px); }
  .btn.primary { background: #e2703a; color: #fff; border-color: #e2703a; }
  .btn.primary:hover { background: #c5663f; color: #fff; }
  .btn.on { background: #ffe3c9; border-color: #e2703a; color: #b4442c; }
  .nowline { font-size: 13.5px; color: #8a7666; margin-left: auto; }
  .grid-title { font-size: 13px; font-weight: 700; color: #8a7666; letter-spacing: .12em; margin: 20px 0 10px; }
  .grid {
    display: flex; flex-wrap: wrap; gap: 8px;
  }
  .tbtn {
    border: 1px solid rgba(120, 60, 40, .18); background: rgba(255,255,255,.7);
    border-radius: 10px; padding: 7px 12px; font-size: 13px; cursor: pointer; color: #4a3b32;
    transition: all .12s; font-family: inherit;
  }
  .tbtn:hover { background: #fff; border-color: #e2703a; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(160,90,40,.14); }
  .tbtn.active { background: #e2703a; color: #fff; border-color: #e2703a; }
</style>
</head>
<body>
<main>
  <h1>🦀 Clawd 动作游乐场 <em>· 100 式</em></h1>
  <p class="sub">点击下方任意动作名，Clawd 马上表演；也可以直接单击舞台上的它随机来一个。长按它还有轮盘菜单。</p>

  <div class="stage-wrap" id="stage">
    <div class="now" id="now">准备中…</div>
  </div>

  <div class="ctrl">
    <button class="btn primary" id="random">🎲 随机来一个</button>
    <button class="btn" id="auto">▶ 自动连播</button>
    <span class="nowline" id="count"></span>
  </div>

  <div class="grid-title">全部动作</div>
  <div class="grid" id="grid"></div>
</main>

<script>window.CLAWD_PET_NO_AUTO = true;</script>
<script src="./clawd-engine.js"></script>
<script>
(function () {
  var stage = document.getElementById('stage');
  var nowEl = document.getElementById('now');
  var grid = document.getElementById('grid');
  var pet = window.ClawdPet.mount({ container: stage, storageKey: 'clawdpg', autoSleep: false, sleepWindow: false });

  // 生成 100 个动作按钮
  var tricks = window.ClawdPet.tricks || [];
  document.getElementById('count').textContent = '共 ' + tricks.length + ' 式 · 已全解锁';
  tricks.forEach(function (t) {
    var b = document.createElement('button');
    b.className = 'tbtn';
    b.textContent = t.name;
    b.addEventListener('click', function () {
      play(t.id, t.name);
      Array.prototype.forEach.call(grid.children, function (x) { x.classList.remove('active'); });
      b.classList.add('active');
    });
    grid.appendChild(b);
  });

  function play(id, name) {
    nowEl.textContent = '正在表演：' + name;
    window.ClawdPet.playTrick(id);
  }
  document.getElementById('random').addEventListener('click', function () {
    var t = tricks[(Math.random() * tricks.length) | 0];
    play(t.id, t.name);
  });
  var autoOn = false, autoTimer = 0;
  document.getElementById('auto').addEventListener('click', function () {
    autoOn = !autoOn;
    this.classList.toggle('on', autoOn);
    this.textContent = autoOn ? '⏸ 停止连播' : '▶ 自动连播';
    if (autoOn) {
      var step = function () {
        if (!autoOn) return;
        var t = tricks[(Math.random() * tricks.length) | 0];
        play(t.id, t.name);
        autoTimer = setTimeout(step, 2600);
      };
      step();
    } else clearTimeout(autoTimer);
  });

  // 默认来一个
  setTimeout(function () {
    var t = tricks[(Math.random() * tricks.length) | 0];
    play(t.id, t.name);
  }, 800);
})();
</script>
</body>
</html>
