<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Clawd 抓娃娃机 — bt's Arcade</title>
<meta name="theme-color" content="#0000f2" />
<style>
  @font-face { font-family:'Oswald'; font-style:normal; font-weight:400 700; font-display:swap; src:url('/fonts/oswald-var.woff2') format('woff2'); }
  @font-face { font-family:'Courier Prime'; font-style:normal; font-weight:400; font-display:swap; src:url('/fonts/courier-prime-400.woff2') format('woff2'); }
  @font-face { font-family:'Courier Prime'; font-style:normal; font-weight:700; font-display:swap; src:url('/fonts/courier-prime-700.woff2') format('woff2'); }
  :root {
    --paper:#fdfdfd; --panel:#f5f5f5; --ink:#111; --soft:#4a4a4a; --muted:#8a8a8a;
    --primary:#0000f2; --line:rgba(17,17,17,0.14); --dotted:#c9c9c9;
    --display:"Oswald","PingFang SC","Microsoft YaHei",sans-serif;
    --mono:"Courier Prime",ui-monospace,Menlo,Consolas,monospace;
    --body:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  }
  html.dark {
    --paper:#0e0e13; --panel:#15151c; --ink:#f0f0f2; --soft:#b9b9c2; --muted:#8b8b95;
    --primary:#6e6eff; --line:rgba(240,240,242,0.16); --dotted:#3a3a44;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--paper); color:var(--ink); font-family:var(--body); min-height:100vh; }
  .wrap { max-width:1120px; margin:0 auto; padding:0 20px; }
  header { border-bottom:1px dotted var(--dotted); padding:18px 0; display:flex; align-items:center; justify-content:space-between; }
  .brand { font-family:var(--mono); font-weight:700; letter-spacing:.18em; text-transform:uppercase; color:var(--primary); text-decoration:none; font-size:1.05rem; }
  .back { font-family:var(--mono); font-size:.8rem; color:var(--soft); text-decoration:none; }
  .back:hover { color:var(--primary); }
  main { padding:34px 0 60px; }
  .kicker { font-family:var(--mono); font-size:.68rem; font-weight:700; text-transform:uppercase; letter-spacing:.18em; color:var(--primary); margin-bottom:8px; }
  h1 { font-family:var(--display); font-weight:600; font-size:clamp(1.9rem,5vw,2.8rem); text-transform:uppercase; }
  .sub { font-family:var(--mono); font-size:.82rem; color:var(--soft); margin:10px 0 22px; line-height:1.7; }
  .row { display:flex; gap:22px; flex-wrap:wrap; align-items:flex-start; }
  .pad { display:flex; flex-direction:column; gap:9px; width:150px; }
  .pbtn {
    font-family:var(--mono); font-size:.85rem; padding:10px 14px; border-radius:999px;
    border:1px solid var(--line); background:var(--panel); color:var(--ink); cursor:pointer;
    text-align:left; transition:transform .1s, border-color .15s, background .15s;
  }
  .pbtn:hover:not(:disabled) { border-color:var(--primary); transform:translateY(-1px); }
  .pbtn:active:not(:disabled) { transform:translateY(1px); }
  .pbtn:disabled { opacity:.38; cursor:not-allowed; }
  .pbtn.take { border-color:#2e8a4a; color:#2e8a4a; font-weight:700; }
  html.dark .pbtn.take { color:#5ad08a; }
  .pbtn.take.glow { animation:pulse .9s ease-in-out infinite; }
  @keyframes pulse { 50% { background:rgba(46,138,74,.18); } }
  canvas { max-width:100%; height:auto; display:block; }
  .side { width:270px; display:flex; flex-direction:column; gap:14px; }
  .card { border:1px solid var(--line); border-radius:12px; padding:14px 16px; background:var(--panel); }
  .card h3 { font-family:var(--mono); font-size:.7rem; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); margin-bottom:9px; }
  .stat { display:flex; justify-content:space-between; font-family:var(--mono); font-size:.95rem; margin:5px 0; }
  .stat b { font-size:1.25rem; }
  .pet-stage { position:relative; height:230px; overflow:hidden; border-radius:10px;
    background:linear-gradient(180deg,#e8ecf4 0%,#f6efe2 100%); }
  html.dark .pet-stage { background:linear-gradient(180deg,#15151c 0%,#1c2030 100%); }
  .pet-stage::after { content:''; position:absolute; left:0; right:0; bottom:0; height:26px; background:rgba(120,120,140,.14); }
  .reveal { font-family:var(--mono); font-size:.9rem; min-height:40px; }
  .reveal b { color:var(--primary); }
  .plist { list-style:none; font-family:var(--mono); font-size:.78rem; color:var(--soft); }
  .plist li { padding:4px 0; border-bottom:1px dotted var(--dotted); }
  .hint { font-family:var(--mono); font-size:.72rem; color:var(--muted); margin-top:14px; line-height:1.8; }
  .kbd { border:1px solid var(--dotted); border-radius:4px; padding:0 5px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="brand" href="/games/">bt's Arcade</a>
    <a class="back" href="/games/">← 游戏中心</a>
  </header>
  <main>
    <div class="kicker">Clawd Machine</div>
    <h1>Clawd 抓娃娃机</h1>
    <p class="sub">投币 → 移动爪子 → 下爪 → 抓中的球里藏着 Clawd 的一式动作，领取后它当场表演。抓完的球会自动补货。</p>

    <div class="row">
      <div class="pad">
        <button class="pbtn" id="b-coin">投币 · Insert coin</button>
        <button class="pbtn" id="b-left" disabled>← 左移</button>
        <button class="pbtn" id="b-right" disabled>右移 →</button>
        <button class="pbtn" id="b-up" disabled>↑ 后排</button>
        <button class="pbtn" id="b-down" disabled>↓ 前排</button>
        <button class="pbtn" id="b-drop" disabled>↓ 下爪 Drop</button>
        <button class="pbtn take" id="b-take" disabled>🎁 领取奖品</button>
        <button class="pbtn" id="b-reset">↺ 重摆机台</button>
      </div>
      <canvas id="machine" width="520" height="560"></canvas>
      <div class="side">
        <div class="card">
          <h3>Stats</h3>
          <div class="stat"><span>代币 TOKENS</span><b id="s-tokens">10</b></div>
          <div class="stat"><span>中奖 PRIZES</span><b id="s-won">0</b></div>
        </div>
        <div class="card">
          <h3>Clawd 亲自表演</h3>
          <div class="pet-stage" id="pet-stage"></div>
          <div class="reveal" id="reveal">抓一个球，看它表演</div>
        </div>
        <div class="card">
          <h3>战利品架</h3>
          <ul class="plist" id="plist"><li>还没有战利品</li></ul>
        </div>
      </div>
    </div>
    <p class="hint">键盘可玩：<span class="kbd">←</span> <span class="kbd">→</span> 移动 · <span class="kbd">↑</span> <span class="kbd">↓</span> 换排 · <span class="kbd">空格</span> 下爪 · <span class="kbd">回车</span> 领取。每局 30 秒，抓中 +2 代币。</p>
  </main>
</div>

<script>window.CLAWD_PET_NO_AUTO = true;</script>
<script src="/clawd-engine.js"></script>
<script>
(function () {
  'use strict';
  var cv = document.getElementById('machine');
  var g = cv.getContext('2d');
  var DPR = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = 520 * DPR; cv.height = 560 * DPR;
  g.setTransform(DPR, 0, 0, DPR, 0, 0);

  /* ---- Clawd 宠物（表演位） ---- */
  var pet = window.ClawdPet && window.ClawdPet.mount({ container: document.getElementById('pet-stage'),
    autoSleep: false, sleepWindow: false });

  /* ---- 存档 ---- */
  var save = { tokens: 10, won: 0, prizes: [] };
  try { var raw = JSON.parse(localStorage.getItem('clawd_arcade') || 'null'); if (raw) save = Object.assign(save, raw); } catch (e) {}
  function persist() { try { localStorage.setItem('clawd_arcade', JSON.stringify(save)); } catch (e) {} }

  /* ---- 动作池 ---- */
  var TRICKS = (window.ClawdPet && window.ClawdPet.tricks) || [];
  var pool = [];

  /* ---- 机器状态 ---- */
  var S = {
    phase: 'off',           // off | ready | drop | close | rise | carry | release | won
    clawX: 255, targetX: 255,
    clawY: 150, dropTo: 330,
    row: 0,                 // 0 前排 1 后排
    open: 1,                // 爪子开合 0..1
    timer: 0,
    grabbed: null,          // 被抓住的球
    balls: [],              // {x,y,row,color,action}
    t: 0, animT: 0,
    msg: 'INSERT COIN'
  };
  var COLORS = ['#e05a5a', '#4a6ec9', '#4a9e4a', '#e8b84a', '#9a6ec9', '#f0f0f2', '#5ac0c9'];

  function refill() {
    while (S.balls.length < 10) {
      var row = S.balls.filter(function (b) { return b.row === 0; }).length <= S.balls.filter(function (b) { return b.row === 1; }).length ? 0 : 1;
      var col = S.balls.filter(function (b) { return b.row === row; }).length % 5;
      var trick = TRICKS[(Math.random() * TRICKS.length) | 0];
      S.balls.push({ row: row, col: col, color: COLORS[(Math.random() * COLORS.length) | 0],
        x: 140 + col * 50 + (row ? 25 : 0) + (Math.random() * 10 - 5),
        y: row ? 392 : 360, action: trick, star: Math.random() < 0.34 });
    }
  }

  /* ---- LED 与按钮状态 ---- */
  var els = { tokens: document.getElementById('s-tokens'), won: document.getElementById('s-won'),
    take: document.getElementById('b-take'), reveal: document.getElementById('reveal'), plist: document.getElementById('plist') };
  var btns = { coin: document.getElementById('b-coin'), left: document.getElementById('b-left'), right: document.getElementById('b-right'),
    up: document.getElementById('b-up'), down: document.getElementById('b-down'), drop: document.getElementById('b-drop'), reset: document.getElementById('b-reset') };

  function renderUI() {
    els.tokens.textContent = save.tokens;
    els.won.textContent = save.won;
    var on = S.phase === 'ready';
    btns.left.disabled = btns.right.disabled = btns.up.disabled = btns.down.disabled = btns.drop.disabled = !on;
    btns.coin.disabled = S.phase !== 'off';
    els.take.disabled = S.phase !== 'won';
    els.take.classList.toggle('glow', S.phase === 'won');
    btns.reset.disabled = S.phase !== 'off' && S.phase !== 'ready';
    var plist = save.prizes.slice(0, 12).map(function (pz) { return '<li>' + pz + '</li>'; }).join('');
    els.plist.innerHTML = plist || '<li>还没有战利品</li>';
  }

  /* ---- 音效（独立小合成器） ---- */
  var AC = null;
  function tone(f0, f1, dur, type, vol) {
    try {
      AC = AC || new (window.AudioContext || window.webkitAudioContext)();
      var t0 = AC.currentTime, o = AC.createOscillator(), gn = AC.createGain();
      o.type = type || 'square';
      o.frequency.setValueAtTime(f0, t0);
      o.frequency.exponentialRampToValueAtTime(Math.max(f1, 1), t0 + dur);
      gn.gain.setValueAtTime(0.0001, t0);
      gn.gain.exponentialRampToValueAtTime(vol || 0.05, t0 + 0.012);
      gn.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(gn); gn.connect(AC.destination);
      o.start(t0); o.stop(t0 + dur + 0.03);
    } catch (e) {}
  }
  var SFX = { coin: function () { tone(990, 1480, 0.14, 'square', 0.05); }, move: function () { tone(420, 380, 0.04, 'square', 0.02); },
    drop: function () { tone(300, 140, 0.2, 'triangle', 0.04); }, grab: function () { tone(700, 1050, 0.12, 'square', 0.04); },
    win: function () { tone(660, 660, 0.16, 'square', 0.05); tone(990, 990, 0.22, 'square', 0.045, 0.14); },
    miss: function () { tone(220, 130, 0.25, 'sawtooth', 0.035); } };

  /* ---- 流程 ---- */
  function insertCoin() {
    if (S.phase !== 'off' && S.phase !== 'ready') return;
    if (save.tokens <= 0) { S.msg = 'NO TOKENS'; renderUI(); return; }
    save.tokens--; persist(); renderUI();
    refill();
    S.phase = 'ready'; S.timer = 30; S.msg = 'TIME 30';
    S.clawX = 255; S.clawY = 150; S.open = 1; S.grabbed = null; S.row = 0;
    SFX.coin();
  }
  function moveClaw(d) {
    if (S.phase !== 'ready') return;
    S.clawX = Math.max(120, Math.min(390, S.clawX + d));
    SFX.move();
  }
  function switchRow(d) {
    if (S.phase !== 'ready') return;
    S.row = Math.max(0, Math.min(1, S.row + d));
    SFX.move();
  }
  function dropClaw() {
    if (S.phase !== 'ready') return;
    S.phase = 'drop';
    S.dropTo = S.row ? 386 : 356;
    S.msg = 'LOCK'; SFX.drop();
  }
  function takePrize() {
    if (S.phase !== 'won' || !S.grabbed) return;
    save.won++; save.tokens += 2;
    var act = S.grabbed.action;
    save.prizes.unshift('⭐ ' + act.name);
    if (save.prizes.length > 24) save.prizes.length = 24;
    persist(); renderUI();
    els.reveal.innerHTML = '🎁 抽中动作：<b>' + act.name + '</b> — Clawd 当场表演！';
    window.ClawdPet.playTrick(act.id);
    S.grabbed = null;
    S.phase = 'ready'; S.timer = 30; S.msg = 'TIME 30';
    refill();
  }
  function resetMachine() {
    if (S.phase !== 'off' && S.phase !== 'ready') return;
    S.balls.length = 0; refill();
    S.clawX = 255; S.clawY = 150; S.row = 0; S.grabbed = null;
    if (S.phase === 'off') S.msg = 'INSERT COIN';
    else { S.timer = 30; S.msg = 'TIME 30'; }
  }

  btns.coin.addEventListener('click', insertCoin);
  btns.left.addEventListener('click', function () { moveClaw(-14); });
  btns.right.addEventListener('click', function () { moveClaw(14); });
  btns.up.addEventListener('click', function () { switchRow(-1); });
  btns.down.addEventListener('click', function () { switchRow(1); });
  btns.drop.addEventListener('click', dropClaw);
  btns.reset.addEventListener('click', resetMachine);
  els.take.addEventListener('click', takePrize);
  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowLeft') { moveClaw(-14); e.preventDefault(); }
    else if (e.key === 'ArrowRight') { moveClaw(14); e.preventDefault(); }
    else if (e.key === 'ArrowUp') { switchRow(-1); e.preventDefault(); }
    else if (e.key === 'ArrowDown') { switchRow(1); e.preventDefault(); }
    else if (e.key === ' ') { dropClaw(); e.preventDefault(); }
    else if (e.key === 'Enter') { takePrize(); e.preventDefault(); }
  });

  /* ---- 逐帧逻辑 ---- */
  function step() {
    var now = Date.now();
    if (now - (S.lastAt || 0) < 30) return; // rAF 与兜底定时器双驱动去重

    var wallDt = Math.min(1.0, (now - (S.lastAt || now)) / 1000);
    S.lastAt = now;
    S.animT = now / 1000;
    if (S.phase === 'ready') {
      if (S.phaseAt == null) S.phaseAt = now;
      S.timer = Math.max(0, S.timerTotal - (now - S.phaseAt) / 1000);
      S.msg = 'TIME ' + Math.ceil(S.timer);
      if (keys.left) moveClaw(-170 * wallDt);
      if (keys.right) moveClaw(170 * wallDt);
      if (S.timer <= 0) { S.phase = 'off'; S.msg = 'INSERT COIN'; S.phaseAt = null; }
    } else if (S.phase === 'drop') {
      var p = Math.min(1, (now - S.phaseAt) / 1100);
      S.clawY = S.fromY + (S.dropTo - S.fromY) * p;
      if (p >= 1) { S.phase = 'close'; S.phaseAt = now; S.closeT = 0; }
    } else if (S.phase === 'close') {
      var cp = Math.min(1, (now - S.phaseAt) / 300);
      S.open = 1 - cp;
      if (cp >= 1) {
        var target = null, best = 1e9;
        for (var i = 0; i < S.balls.length; i++) {
          var b = S.balls[i];
          if (b.row !== S.row) continue;
          var d = Math.abs(b.x - S.clawX);
          if (d < best) { best = d; target = b; }
        }
        var p2 = best < 8 ? 0.92 : best < 16 ? 0.62 : best < 24 ? 0.3 : 0;
        if (target && Math.random() < p2) {
          S.grabbed = target;
          S.balls.splice(S.balls.indexOf(target), 1);
          SFX.grab();
        } else SFX.miss();
        S.phase = 'rise'; S.phaseAt = now; S.fromY = S.clawY;
      }
    } else if (S.phase === 'rise') {
      var rp = Math.min(1, (now - S.phaseAt) / 1200);
      S.clawY = S.fromY + (150 - S.fromY) * rp;
      if (S.grabbed) { S.grabbed.x = S.clawX; S.grabbed.y = S.clawY + 26; }
      if (rp >= 1) { S.phase = 'carry'; S.phaseAt = now; S.fromX = S.clawX; }
    } else if (S.phase === 'carry') {
      var cp2 = Math.min(1, (now - S.phaseAt) / 900);
      S.clawX = S.fromX + (85 - S.fromX) * cp2;
      if (S.grabbed) { S.grabbed.x = S.clawX; S.grabbed.y = S.clawY + 26; }
      if (cp2 >= 1) {
        S.phase = 'release'; S.phaseAt = now; S.open = 1; S.relT = 0;
        if (S.grabbed) { S.grabbed.x = 92; S.grabbed.vy = 0; }
        S.msg = S.grabbed ? 'YOU WIN TAKE IT' : 'BAD LUCK';
        if (S.grabbed) SFX.win(); else SFX.miss();
      }
    } else if (S.phase === 'release') {
      var rp2 = Math.min(1, (now - S.phaseAt) / 700);
      if (S.grabbed) { S.grabbed.vy = (S.grabbed.vy || 0) + 900 * Math.min(1.0, wallDt); S.grabbed.y += S.grabbed.vy * Math.min(1.0, wallDt); }
      if (rp2 >= 1) {
        S.phase = S.grabbed ? 'won' : 'ready';
        if (S.phase === 'ready') { S.timerTotal = 30; S.phaseAt = Date.now(); S.msg = 'TIME 30'; }
        if (S.phase !== 'won') S.grabbed = null;
      }
    } else if (S.phase === 'won') {
      if (S.grabbed) { S.grabbed.y = Math.min(470, S.grabbed.y + 60 * wallDt); }
    }
  }
  var keys = { left: false, right: false };

  /* ---- 绘制 ---- */
  function drawBall(b) {
    g.beginPath(); g.arc(b.x, b.y, 15, 0, Math.PI * 2);
    g.fillStyle = b.color; g.fill();
    g.strokeStyle = 'rgba(60,20,40,.4)'; g.lineWidth = 1.6; g.stroke();
    g.beginPath(); g.arc(b.x - 5, b.y - 6, 4, 0, Math.PI * 2);
    g.fillStyle = 'rgba(255,255,255,.55)'; g.fill();
    if (b.star) { g.font = '11px sans-serif'; g.textAlign = 'center'; g.fillStyle = '#ffd76e'; g.fillText('★', b.x, b.y + 4); }
  }
  function drawClaw(x, y, open, holding) {
    g.strokeStyle = '#8a8a98'; g.lineWidth = 3;
    g.beginPath(); g.moveTo(x, y - 30); g.lineTo(x, y - 6); g.stroke();
    var spread = 8 + open * 14;
    g.strokeStyle = '#c9c9d4'; g.lineWidth = 4; g.lineCap = 'round';
    g.beginPath(); g.moveTo(x - 4, y - 6); g.lineTo(x - spread, y + 12); g.stroke();
    g.beginPath(); g.moveTo(x + 4, y - 6); g.lineTo(x + spread, y + 12); g.stroke();
    g.strokeStyle = '#8a8a98'; g.lineWidth = 2.4;
    g.beginPath(); g.moveTo(x - spread, y + 12); g.lineTo(x - spread - 2, y + 20); g.stroke();
    g.beginPath(); g.moveTo(x + spread, y + 12); g.lineTo(x + spread + 2, y + 20); g.stroke();
    if (holding) { g.strokeStyle = '#c9c9d4'; g.beginPath(); g.arc(x, y + 2, 9, 0, Math.PI * 2); g.stroke(); }
  }

  function render() {
    g.clearRect(0, 0, 520, 560);
    // 影子
    g.beginPath(); g.ellipse(262, 536, 205, 26, 0, 0, Math.PI * 2);
    g.fillStyle = '#4a5ac9'; g.fill();
    // 机身
    g.fillStyle = '#f2a0b5'; g.strokeStyle = '#4a2a3a'; g.lineWidth = 3;
    roundRect(70, 80, 380, 420, 12); g.fill(); g.stroke();
    g.fillStyle = '#d98298'; roundRect(70, 80, 26, 420, 10); g.fill();
    // 顶部灯箱
    g.fillStyle = '#f2a0b5'; roundRect(148, 46, 224, 62, 10); g.fill(); g.stroke();
    g.fillStyle = '#5a3a4a'; g.font = '700 21px monospace'; g.textAlign = 'center';
    g.fillText('LUCKY CLAW', 260, 86);
    var on = S.phase !== 'off';
    for (var i = 0; i < 7; i++) {
      g.beginPath(); g.arc(178 + i * 28, 56, 3.4, 0, Math.PI * 2);
      g.fillStyle = on && Math.floor(S.animT * 3) % 2 === 0 ? '#ffe08a' : '#c98098'; g.fill();
    }
    // 玻璃
    g.fillStyle = 'rgba(252,232,242,.5)'; roundRect(95, 128, 330, 282, 6); g.fill();
    g.strokeStyle = 'rgba(90,58,74,.5)'; g.lineWidth = 2; g.stroke();
    g.beginPath(); g.moveTo(130, 132); g.lineTo(180, 260); g.lineTo(150, 260);
    g.strokeStyle = 'rgba(255,255,255,.5)'; g.lineWidth = 8; g.stroke();
    // 导轨 + 爪
    g.fillStyle = '#8a8a98'; g.fillRect(100, 136, 320, 8);
    var cx = S.clawX, cy = S.clawY;
    g.fillStyle = '#5a5a68'; g.fillRect(cx - 15, cy - 24, 30, 16);
    drawClaw(cx, cy, S.open, S.grabbed);
    // 球
    for (var j = 0; j < S.balls.length; j++) drawBall(S.balls[j]);
    if (S.grabbed && (S.phase === 'rise' || S.phase === 'carry')) drawBall(S.grabbed);
    if (S.grabbed && S.phase === 'won') drawBall(S.grabbed);
    // 出奖口
    g.fillStyle = '#2a1a24'; g.fillRect(95, 366, 26, 40);
    g.fillStyle = '#c98098'; g.fillRect(93, 362, 30, 6);
    // 基座
    g.fillStyle = '#c96a86'; roundRect(78, 408, 364, 92, 8); g.fill(); g.stroke();
    g.fillStyle = '#5a3a4a'; g.font = '600 26px Oswald,monospace'; g.fillText('PRIZES', 132, 468);
    // LED 屏
    g.fillStyle = '#0e2a1e'; roundRect(296, 448, 130, 34, 4); g.fill();
    g.fillStyle = '#35e08a'; g.font = '700 13px monospace';
    g.fillText(S.msg.slice(0, 16), 302, 470);
    // 投币口 + 红按钮
    g.fillStyle = '#3a2a34'; g.fillRect(300, 492, 46, 16);
    g.beginPath(); g.arc(240, 470, 13, 0, Math.PI * 2); g.fillStyle = S.phase === 'ready' ? '#e05a5a' : '#8a4a4a'; g.fill();
    g.strokeStyle = '#4a2a3a'; g.lineWidth = 2; g.stroke();
    g.fillStyle = '#3a2a34'; g.fillRect(234, 452, 12, 8);
  }
  function roundRect(x, y, w, h, r) {
    g.beginPath();
    g.moveTo(x + r, y);
    g.arcTo(x + w, y, x + w, y + h, r);
    g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r);
    g.arcTo(x, y, x + w, y, r);
    g.closePath();
  }

  /* ---- 主循环 ---- */
  var keys = { left: false, right: false };
  var lastT = performance.now();
  function loop(now) {
    var dt = Math.min(0.05, (now - lastT) / 1000);
    lastT = now;
    step(dt);
    render();
    requestAnimationFrame(loop);
  // 兜底：rAF 被浏览器暂停/强节流时，用定时器继续推进（真实浏览器中此路不触发）
  setInterval(function () { step(); }, 120);
  }
  requestAnimationFrame(loop);

  window.addEventListener('keydown', function (e) { if (e.key === 'ArrowLeft') keys.left = true; if (e.key === 'ArrowRight') keys.right = true; });
  window.addEventListener('keyup', function (e) { if (e.key === 'ArrowLeft') keys.left = false; if (e.key === 'ArrowRight') keys.right = false; });

  refill();
  renderUI();
})();
</script>
</body>
