<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" font-family="'Courier Prime',ui-monospace,Menlo,monospace">
  <defs>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#20202b"/>
    </pattern>
  </defs>

  <!-- 硬边纸面底 -->
  <rect width="800" height="560" fill="#0e0e13"/>
  <rect width="800" height="560" fill="url(#dots)"/>

  <!-- 角标 -->
  <g transform="translate(40,40)">
    <rect x="0" y="0" width="236" height="34" fill="#0e0e13" stroke="#6e6eff" stroke-width="3"/>
    <text x="14" y="23" fill="#6e6eff" font-size="14" letter-spacing="3">✪ PELICAN EXPRESS</text>
  </g>

  <!-- 卡片 + 错位阴影 -->
  <rect x="44" y="104" width="728" height="400" fill="#6e6eff" opacity="0.28"/>
  <rect x="36" y="96" width="728" height="400" fill="#15151d" stroke="#33334a" stroke-width="3"/>

  <!-- 速度线 -->
  <g stroke="#4a4a66" stroke-width="6" stroke-linecap="round">
    <line x1="95" y1="255" x2="175" y2="255"/>
    <line x1="80" y1="295" x2="150" y2="295"/>
    <line x1="95" y1="335" x2="170" y2="335"/>
    <animateTransform attributeName="transform" type="translate" values="0 0; -28 0; 0 0" keyTimes="0;0.5;1" dur="1.4s" repeatCount="indefinite"/>
  </g>

  <!-- 地面 -->
  <line x1="70" y1="483" x2="730" y2="483" stroke="#33334a" stroke-width="4"/>
  <line x1="70" y1="483" x2="730" y2="483" stroke="#6e6eff" stroke-width="4" stroke-dasharray="42 30" opacity="0.8">
    <animate attributeName="stroke-dashoffset" from="0" to="-72" dur="0.6s" repeatCount="indefinite"/>
  </line>

  <!-- 传动：链 + 牙盘 -->
  <line x1="392" y1="396" x2="258" y2="409" stroke="#3a3a52" stroke-width="2.5" stroke-dasharray="5 4"/>
  <line x1="392" y1="434" x2="258" y2="421" stroke="#3a3a52" stroke-width="2.5" stroke-dasharray="5 4"/>
  <circle cx="400" cy="415" r="22" fill="none" stroke="#55556e" stroke-width="4"/>

  <!-- 远侧腿（暗色，8 帧蹬踏，相位差 180°） -->
  <path fill="none" stroke="#b9b9c9" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"
    d="M382,286 L385,343 L376,391 L396,389">
    <animate attributeName="d" dur="1.6s" repeatCount="indefinite"
      keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1"
      values="M382,286 L385,343 L376,391 L396,389;
              M382,286 L397,335 L400,381 L420,379;
              M382,286 L409,337 L424,391 L444,389;
              M382,286 L413,349 L434,415 L454,413;
              M382,286 L409,362 L424,439 L444,437;
              M382,286 L397,369 L400,449 L420,447;
              M382,286 L385,366 L376,439 L396,437;
              M382,286 L380,356 L366,415 L386,413;
              M382,286 L385,343 L376,391 L396,389"/>
  </path>

  <!-- 车架 -->
  <g stroke="#6e6eff" stroke-width="8" stroke-linecap="round" fill="none">
    <line x1="400" y1="415" x2="255" y2="415"/>
    <line x1="255" y1="415" x2="368" y2="302"/>
    <line x1="400" y1="415" x2="368" y2="302"/>
    <line x1="400" y1="415" x2="528" y2="315"/>
    <line x1="368" y1="302" x2="528" y2="315"/>
    <line x1="528" y1="315" x2="565" y2="415"/>
    <line x1="528" y1="315" x2="520" y2="282"/>
    <line x1="520" y1="282" x2="552" y2="276"/>
    <line x1="368" y1="302" x2="364" y2="288"/>
  </g>
  <circle cx="552" cy="276" r="5" fill="#ECECF4"/>
  <rect x="334" y="278" width="66" height="12" rx="6" fill="#ECECF4"/>

  <!-- 曲柄 + 双踏板（整体旋转） -->
  <g>
    <line x1="400" y1="415" x2="424" y2="439" stroke="#ECECF4" stroke-width="6" stroke-linecap="round"/>
    <rect x="412" y="434.5" width="24" height="9" rx="2" fill="#FFB454"/>
    <line x1="400" y1="415" x2="376" y2="391" stroke="#ECECF4" stroke-width="6" stroke-linecap="round"/>
    <rect x="364" y="386.5" width="24" height="9" rx="2" fill="#FFB454"/>
    <animateTransform attributeName="transform" type="rotate" from="45 400 415" to="405 400 415" dur="1.6s" repeatCount="indefinite"/>
  </g>

  <!-- 后轮 -->
  <circle cx="255" cy="415" r="66" fill="none" stroke="#ECECF4" stroke-width="8"/>
  <circle cx="255" cy="415" r="48" fill="none" stroke="#3a3a52" stroke-width="3"/>
  <g stroke="#55556e" stroke-width="3">
    <line x1="207" y1="415" x2="303" y2="415"/>
    <line x1="231" y1="373.4" x2="279" y2="456.6"/>
    <line x1="279" y1="373.4" x2="231" y2="456.6"/>
    <animateTransform attributeName="transform" type="rotate" from="0 255 415" to="360 255 415" dur="1.2s" repeatCount="indefinite"/>
  </g>
  <circle cx="255" cy="415" r="8" fill="#6e6eff"/>

  <!-- 前轮 -->
  <circle cx="565" cy="415" r="66" fill="none" stroke="#ECECF4" stroke-width="8"/>
  <circle cx="565" cy="415" r="48" fill="none" stroke="#3a3a52" stroke-width="3"/>
  <g stroke="#55556e" stroke-width="3">
    <line x1="517" y1="415" x2="613" y2="415"/>
    <line x1="541" y1="373.4" x2="589" y2="456.6"/>
    <line x1="589" y1="373.4" x2="541" y2="456.6"/>
    <animateTransform attributeName="transform" type="rotate" from="0 565 415" to="360 565 415" dur="1.2s" repeatCount="indefinite"/>
  </g>
  <circle cx="565" cy="415" r="8" fill="#6e6eff"/>

  <!-- 鹈鹕（身体微微起伏） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 4; 0 0" keyTimes="0;0.5;1" dur="1s" repeatCount="indefinite"/>

    <!-- 尾羽 -->
    <path d="M276,206 L226,186 L266,220 L218,224 L268,236 L232,258 L284,242 Z" fill="#ECECF4"/>

    <!-- 围巾 -->
    <path d="M416,208 L382,224 L410,230 Z" fill="#ff5d5d"/>
    <path d="M408,228 L380,246 L408,246 Z" fill="#ff5d5d"/>

    <!-- 身体 -->
    <ellipse cx="352" cy="232" rx="80" ry="60" fill="#F2F2F7"/>

    <!-- 近侧腿（8 帧蹬踏，脚跟着曲柄走） -->
    <path fill="none" stroke="#F2F2F7" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"
      d="M398,282 L425,358 L424,439 L444,437">
      <animate attributeName="d" dur="1.6s" repeatCount="indefinite"
        keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1"
        values="M398,282 L425,358 L424,439 L444,437;
                M398,282 L413,365 L400,449 L420,447;
                M398,282 L401,362 L376,439 L396,437;
                M398,282 L396,352 L366,415 L386,413;
                M398,282 L401,339 L376,391 L396,389;
                M398,282 L413,331 L400,381 L420,379;
                M398,282 L425,333 L424,391 L444,389;
                M398,282 L429,345 L434,415 L454,413;
                M398,282 L425,358 L424,439 L444,437"/>
    </path>
    <path fill="none" stroke="#FFB454" stroke-width="8" stroke-linecap="round"
      d="M424,439 L444,437">
      <animate attributeName="d" dur="1.6s" repeatCount="indefinite"
        keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1"
        values="M424,439 L444,437;
                M400,449 L420,447;
                M376,439 L396,437;
                M366,415 L386,413;
                M376,391 L396,389;
                M400,381 L420,379;
                M424,391 L444,389;
                M434,415 L454,413;
                M424,439 L444,437"/>
    </path>

    <!-- 脖子 + 头 -->
    <path d="M414,214 C446,196 452,178 470,158" fill="none" stroke="#F2F2F7" stroke-width="24" stroke-linecap="round"/>
    <circle cx="482" cy="142" r="27" fill="#F2F2F7"/>

    <!-- 贝雷帽 -->
    <path d="M456,132 A27,27 0 0 1 508,130 Z" fill="#6e6eff"/>
    <line x1="482" y1="108" x2="482" y2="100" stroke="#6e6eff" stroke-width="3"/>
    <circle cx="482" cy="97" r="3.5" fill="#6e6eff"/>

    <!-- 眼睛 -->
    <circle cx="494" cy="140" r="4.5" fill="#0e0e13"/>
    <circle cx="496" cy="138" r="1.4" fill="#ffffff"/>

    <!-- 大嘴：上喙 + 喉囊 + 鱼 -->
    <path d="M506,146 C540,144 584,152 616,162 L610,170 C576,162 540,158 508,158 Z" fill="#FFB454"/>
    <path d="M508,155 C514,192 562,202 604,168 C570,178 532,172 508,158 Z" fill="#FFC97A"/>
    <g transform="rotate(-12 568 178)">
      <ellipse cx="568" cy="178" rx="15" ry="5.5" fill="#6e6eff"/>
      <path d="M581,174 L592,168 L590,182 Z" fill="#6e6eff"/>
      <circle cx="560" cy="176" r="1.8" fill="#ffffff"/>
    </g>

    <!-- 翅膀扶把 -->
    <path d="M320,206 C390,208 470,246 548,278 C520,290 420,272 352,258 C330,250 316,232 320,206 Z" fill="#d9d9e6"/>
  </g>

  <!-- 底部注释 -->
  <text x="400" y="536" text-anchor="middle" fill="#55556e" font-size="12" letter-spacing="3">HANDMADE SVG · ONE PELICAN · NOW ACTUALLY PEDALING</text>
</svg>
